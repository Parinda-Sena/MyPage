
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Cat Cafe Portfolio</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f4ece1;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .ui-btn {
            background-color: #7c523f;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
        }

        .ui-btn:hover {
            background-color: #a06e56;
            transform: translateY(-2px);
        }

        .hint-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #5a3d31;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body>

    <div class="hint-text">
        💡 คลิกที่ประตูเพื่อเปิด/ปิดร้าน หรือกดปุ่มด้านล่างเพื่อสลับมุมมอง
    </div>

    <div class="ui-container">
        <button class="ui-btn" onclick="toggleDoor()">🚪 เปิด/ปิดประตู</button>
        <button class="ui-btn" onclick="focusPhoto()">🖼️ ซูมรูปโปรไฟล์</button>
        <button class="ui-btn" onclick="focusCV()">📜 ซูมดูประวัติ (CV)</button>
    </div>

    <script>
        // =========================================
        // SCENE
        // =========================================

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4ece1);

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        // ปรับกล้องให้เห็นร้านและหัวแมวครบขึ้น
        const defaultCamPos = {
            x: 0,
            y: 5.5,
            z: 16
        };

        const defaultTarget = {
            x: 0,
            y: 2.5,
            z: 0
        };

        camera.position.set(
            defaultCamPos.x,
            defaultCamPos.y,
            defaultCamPos.z
        );

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            window.devicePixelRatio
        );

        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;

        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(
            0xffffff,
            0.7
        );

        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(
            0xffffff,
            0.8
        );

        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;

        controls.target.set(
            defaultTarget.x,
            defaultTarget.y,
            defaultTarget.z
        );

        // =========================================
        // MODEL VARIABLES
        // =========================================

        let cafeModel = null;
        let mixer = null;
        let doorAction = null;
        let isDoorOpen = false;

        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // =========================================
        // VERTEX SHADER
        // ใช้กับตัวอักษร CAT CAFE เท่านั้น
        // =========================================

        const catCafeVertexShader = `
            varying vec3 vNormal;
            varying vec3 vViewPosition;

            void main() {
                vNormal = normalize(normalMatrix * normal);

                vec4 mvPosition =
                    modelViewMatrix * vec4(position, 1.0);

                vViewPosition = -mvPosition.xyz;

                gl_Position =
                    projectionMatrix * mvPosition;
            }
        `;

        // =========================================
        // FRAGMENT SHADER
        // ทำสีตัวอักษรและขอบเรืองแสง
        // =========================================

        const catCafeFragmentShader = `
            uniform vec3 glowColor;
            uniform float glowIntensity;

            varying vec3 vNormal;
            varying vec3 vViewPosition;

            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);

                float fresnel = pow(
                    1.0 - abs(dot(normal, viewDir)),
                    2.0
                );

                vec3 baseColor = vec3(
                    0.10,
                    0.75,
                    1.0
                );

                vec3 finalColor =
                    baseColor +
                    glowColor * fresnel * glowIntensity;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // =========================================
        // CREATE CAT CAFE GLOW MATERIAL
        // =========================================

        function createCatCafeMaterial() {
            return new THREE.ShaderMaterial({
                vertexShader: catCafeVertexShader,
                fragmentShader: catCafeFragmentShader,

                uniforms: {
                    glowColor: {
                        value: new THREE.Color(0x66ddff)
                    },

                    glowIntensity: {
                        value: 1.5
                    }
                },

                side: THREE.DoubleSide
            });
        }

        // =========================================
        // LOAD GLB MODEL
        // =========================================

        const loader = new THREE.GLTFLoader();

        loader.load(
            'catcafe.glb',

            function (gltf) {
                cafeModel = gltf.scene;

                // ตรวจชื่อ Mesh และ Material ทุกชิ้น
                // ดูผลได้ใน Developer Tools > Console
                cafeModel.traverse(function (object) {
                    if (!object.isMesh) {
                        return;
                    }

                    console.log(
                        'Mesh name:',
                        object.name,
                        '| Material:',
                        Array.isArray(object.material)
                            ? object.material.map(
                                material => material.name
                            )
                            : object.material?.name
                    );
                });

                scene.add(cafeModel);

                // =====================================
                // APPLY SHADER ONLY TO CAT CAFE TEXT
                // =====================================

               
cafeModel.traverse(function (object) {
    if (!object.isMesh) {
        return;
    }

    // เลือกเฉพาะ Mesh ตัวอักษรบนป้าย CAT CAFE
    if (
        object.name === 'Sign_Name_3D' ||
        object.name === 'Sign_Name_3D003'
    ) {
        object.material = new THREE.ShaderMaterial({
            vertexShader: catCafeVertexShader,
            fragmentShader: catCafeFragmentShader,

            uniforms: {
                glowColor: {
                    value: new THREE.Color(0x66ddff)
                },

                glowIntensity: {
                    value: 2.5
                }
            },

            side: THREE.DoubleSide
        });

        console.log(
            'CAT CAFE Shader applied:',
            object.name
        );
    }
});
                // =====================================
                // ORIGINAL ANIMATION
                // =====================================

                if (
                    gltf.animations &&
                    gltf.animations.length > 0
                ) {
                    mixer = new THREE.AnimationMixer(
                        cafeModel
                    );

                    const doorClip =
                        gltf.animations.find(
                            clip =>
                                clip.name.toLowerCase()
                                    .includes('door')
                        ) || gltf.animations[0];

                    if (doorClip) {
                        doorAction =
                            mixer.clipAction(doorClip);

                        doorAction.setLoop(
                            THREE.LoopOnce
                        );

                        doorAction.clampWhenFinished = true;
                    }
                }
            },

            undefined,

            function (error) {
                console.error(
                    'Error loading model:',
                    error
                );
            }
        );

        // =========================================
        // TOGGLE DOOR
        // =========================================

        function toggleDoor() {
            if (!doorAction) {
                return;
            }

            doorAction.paused = false;

            if (!isDoorOpen) {
                doorAction.timeScale = 1;
                doorAction.play();
                isDoorOpen = true;
            } else {
                doorAction.timeScale = -1;
                doorAction.play();
                isDoorOpen = false;
            }
        }

        // =========================================
        // CAMERA MOVEMENT
        // =========================================

        function moveCamera(
            targetCamPos,
            targetLookAt
        ) {
            gsap.to(camera.position, {
                x: targetCamPos.x,
                y: targetCamPos.y,
                z: targetCamPos.z,
                duration: 1.8,
                ease: "power2.inOut"
            });

            gsap.to(controls.target, {
                x: targetLookAt.x,
                y: targetLookAt.y,
                z: targetLookAt.z,
                duration: 1.8,
                ease: "power2.inOut",

                onUpdate: function () {
                    controls.update();
                }
            });
        }

        // =========================================
        // FOCUS CV
        // =========================================

        function focusCV() {
            moveCamera(
                {
                    x: 0.0,
                    y: 4.5,
                    z: 8.0
                },
                {
                    x: 0.0,
                    y: 0.5,
                    z: 1.5
                }
            );
        }

        // =========================================
        // FOCUS PROFILE PHOTO
        // =========================================

        function focusPhoto() {
            moveCamera(
                {
                    x: -1.0,
                    y: 3.5,
                    z: 7.0
                },
                {
                    x: -1.0,
                    y: 2.0,
                    z: 0.0
                }
            );
        }

        // =========================================
        // CLICK MODEL PARTS
        // =========================================

        window.addEventListener('click', function (event) {
            mouse.x =
                (event.clientX / window.innerWidth) * 2 - 1;

            mouse.y =
                -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            if (cafeModel) {
                const intersects =
                    raycaster.intersectObjects(
                        cafeModel.children,
                        true
                    );

                if (intersects.length > 0) {
                    const clickedObj =
                        intersects[0].object;

                    const name =
                        clickedObj.name.toLowerCase();

                    if (
                        name.includes('door') ||
                        name.includes('gate')
                    ) {
                        toggleDoor();
                    } else if (
                        name.includes('frame') ||
                        name.includes('photo') ||
                        name.includes('selfie')
                    ) {
                        focusPhoto();
                    } else if (
                        name.includes('cv') ||
                        name.includes('text')
                    ) {
                        focusCV();
                    }
                }
            }
        });

        // =========================================
        // ANIMATION LOOP
        // =========================================

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (mixer) {
                mixer.update(delta);
            }

            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', function () {
            camera.aspect =
                window.innerWidth / window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        });
    </script>

</body>
</html>
