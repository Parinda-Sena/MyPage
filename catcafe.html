<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Cat Cafe Portfolio</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f4ece1; font-family: sans-serif; }
        canvas { display: block; }
        
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .ui-btn {
            background-color: #7c523f;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
        }

        .ui-btn:hover {
            background-color: #a06e56;
            transform: translateY(-2px);
        }

        .hint-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #5a3d31;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="hint-text">💡 คลิกที่ประตูเพื่อเปิด/ปิดร้าน หรือกดปุ่มด้านล่างเพื่อสลับมุมมอง</div>

    <div class="ui-container">
        <button class="ui-btn" onclick="focusMainView()">🏠 มุมมองหลัก</button>
        <button class="ui-btn" onclick="toggleDoor()">🚪 เปิด/ปิดประตู</button>
        <button class="ui-btn" onclick="focusPhoto()">🖼️ ซูมรูปโปรไฟล์</button>
        <button class="ui-btn" onclick="focusCV()">📜 ซูมดูประวัติ (CV)</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4ece1);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const defaultCamPos = { x: 0, y: 7, z: 20 };
        const defaultTarget = { x: 0, y: 2, z: 0 };
        camera.position.set(defaultCamPos.x, defaultCamPos.y, defaultCamPos.z);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(defaultTarget.x, defaultTarget.y, defaultTarget.z);

        let cafeModel = null;
        let mixer = null;
        let doorAction = null;
        let isDoorOpen = false;

        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // วัสดุสีมาตรฐานสำหรับปรับสีตัวอักษร
        const whiteMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff }); // สีขาว
        const blackMaterial = new THREE.MeshBasicMaterial({ color: 0x111111 }); // สีดำ

        const loader = new THREE.GLTFLoader();
        loader.load('catcafe.glb', (gltf) => {
            cafeModel = gltf.scene;
            scene.add(cafeModel);

            // วนลูปเปลี่ยนสีตัวอักษรตามที่ต้องการ
            cafeModel.traverse((child) => {
                if (child.isMesh) {
                    const name = child.name.toLowerCase();

                    // ป้าย CAT CAFE และ ป้ายเมนูอาหาร -> เปลี่ยนตัวอักษรเป็นสีขาว
                    if (name.includes('cafe') || name.includes('menu') || name.includes('latte') || name.includes('text_menu')) {
                        child.material = whiteMaterial;
                    } 
                    // ข้อความ CV -> เปลี่ยนเป็นสีดำ
                    else if (name.includes('cv') || name.includes('parinda') || name.includes('education') || name.includes('age')) {
                        child.material = blackMaterial;
                    }
                }
            });

            // ตั้งค่าระบบ Animation เปิด/ปิดประตู
            if (gltf.animations && gltf.animations.length > 0) {
                console.log("Found Animations:", gltf.animations);
                mixer = new THREE.AnimationMixer(cafeModel);

                // พยายามหาคลิปชื่อประตู หากไม่เจอจะดึง Animation คลิปแรกในไฟล์มาเล่นทันที
                const doorClip = gltf.animations.find(clip => clip.name.toLowerCase().includes('door') || clip.name.toLowerCase().includes('gate') || clip.name.toLowerCase().includes('open')) || gltf.animations[0];

                if (doorClip) {
                    doorAction = mixer.clipAction(doorClip);
                    doorAction.setLoop(THREE.LoopOnce);
                    doorAction.clampWhenFinished = true; // เปิดค้างไว้เมื่อเล่นจบ
                }
            } else {
                console.warn("No animations found in catcafe.glb");
            }
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });

        // ฟังก์ชันสั่งเปิด/ปิดประตู
        function toggleDoor() {
            if (!doorAction) {
                console.warn("Door action is not ready or missing.");
                return;
            }

            doorAction.paused = false;
            if (!isDoorOpen) {
                doorAction.timeScale = 1; // เล่น Animation เดินหน้า (เปิด)
                doorAction.play();
                isDoorOpen = true;
            } else {
                doorAction.timeScale = -1; // เล่น Animation ย้อนกลับ (ปิด)
                doorAction.play();
                isDoorOpen = false;
            }
        }

        function moveCamera(targetCamPos, targetLookAt) {
            gsap.to(camera.position, {
                x: targetCamPos.x,
                y: targetCamPos.y,
                z: targetCamPos.z,
                duration: 1.8,
                ease: "power2.inOut"
            });

            gsap.to(controls.target, {
                x: targetLookAt.x,
                y: targetLookAt.y,
                z: targetLookAt.z,
                duration: 1.8,
                ease: "power2.inOut",
                onUpdate: () => controls.update()
            });
        }

        function focusMainView() {
            moveCamera(defaultCamPos, defaultTarget);
        }

        function focusCV() {
            moveCamera(
                { x: 0.0, y: 7.0, z: 12.0 }, 
                { x: 0.0, y: 0.5, z: 2.5 }
            );
        }

        function focusPhoto() {
            moveCamera(
                { x: -1.2, y: 2.5, z: 9.0 }, 
                { x: -1.2, y: 2.2, z: 0.0 }
            );
        }

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerWidth) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            if (cafeModel) {
                const intersects = raycaster.intersectObjects(cafeModel.children, true);
                if (intersects.length > 0) {
                    const clickedObj = intersects[0].object;
                    const name = clickedObj.name.toLowerCase();

                    if (name.includes('door') || name.includes('gate') || name.includes('cube')) {
                        toggleDoor();
                    } else if (name.includes('frame') || name.includes('photo') || name.includes('selfie')) {
                        focusPhoto();
                    } else if (name.includes('cv') || name.includes('text')) {
                        focusCV();
                    }
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
