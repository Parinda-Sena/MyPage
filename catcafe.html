<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Cat Cafe Portfolio</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f4ece1; font-family: sans-serif; }
        canvas { display: block; }
        
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .ui-btn {
            background-color: #7c523f;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
        }

        .ui-btn:hover {
            background-color: #a06e56;
            transform: translateY(-2px);
        }

        .hint-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #5a3d31;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="hint-text">💡 คลิกที่ประตูเพื่อเปิด/ปิดร้าน หรือกดปุ่มด้านล่างเพื่อสลับมุมมอง</div>

    <div class="ui-container">
        <button class="ui-btn" onclick="toggleDoor()">🚪 เปิด/ปิดประตู</button>
        <button class="ui-btn" onclick="focusPhoto()">🖼️ ซูมรูปโปรไฟล์</button>
        <button class="ui-btn" onclick="focusCV()">📜 ซูมดูประวัติ (CV)</button>
    </div>

    <!-- Vertex Shader Definition -->
    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        varying vec3 vWorldNormal;
        varying vec3 vWorldPosition;

        void main() {
            vUv = uv;
            
            // คำนวณ Normal vector ใน World Space
            vWorldNormal = normalize(mat3(modelMatrix) * normal);
            
            // คำนวณ Vertex Position ใน World Space
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPos.xyz;

            gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
    </script>

    <!-- Fragment Shader Definition -->
    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform sampler2D mainTexture;
        uniform bool hasTexture;
        uniform vec3 lightPosition;
        uniform vec3 baseColor;

        varying vec2 vUv;
        varying vec3 vWorldNormal;
        varying vec3 vWorldPosition;

        void main() {
            // ดึงสีจาก Texture หรือ Base Color
            vec4 color = hasTexture ? texture2D(mainTexture, vUv) : vec4(baseColor, 1.0);

            // คำนวณแสง Directional ใน World Space
            vec3 normal = normalize(vWorldNormal);
            vec3 lightDir = normalize(lightPosition - vWorldPosition);

            // คำนวณแสง Ambient + Diffuse ให้สว่างนวลตา
            float ambient = 0.6; 
            float diffuse = max(dot(normal, lightDir), 0.0) * 0.4;
            
            float lightIntensity = ambient + diffuse;

            gl_FragColor = vec4(color.rgb * lightIntensity, color.a);
        }
    </script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4ece1);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const defaultCamPos = { x: 0, y: 3.5, z: 9 };
        const defaultTarget = { x: 0, y: 1.2, z: 0 };
        camera.position.set(defaultCamPos.x, defaultCamPos.y, defaultCamPos.z);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(defaultTarget.x, defaultTarget.y, defaultTarget.z);

        // ฟังก์ชันแปลง Material เดิมของ GLTF มาใช้ Custom Shader
        function createCustomShaderMaterial(originalMaterial) {
            if (!originalMaterial) return new THREE.MeshBasicMaterial();

            const map = originalMaterial.map || null;
            const color = originalMaterial.color ? originalMaterial.color : new THREE.Color(0xffffff);

            return new THREE.ShaderMaterial({
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                uniforms: {
                    mainTexture: { value: map },
                    hasTexture: { value: map !== null },
                    lightPosition: { value: dirLight.position },
                    baseColor: { value: color }
                },
                transparent: originalMaterial.transparent || false,
                side: THREE.DoubleSide
            });
        }

        let cafeModel = null;
        let mixer = null;
        let doorAction = null;
        let isDoorOpen = false;

        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const loader = new THREE.GLTFLoader();
        loader.load('catcafe.glb', (gltf) => {
            cafeModel = gltf.scene;

            // นำ Custom Shader ไปใช้กับ Mesh ทุกชิ้นในโมเดล
            cafeModel.traverse((child) => {
                if (child.isMesh) {
                    child.material = createCustomShaderMaterial(child.material);
                }
            });

            scene.add(cafeModel);

            // ตั้งค่า Animation Mixer
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(cafeModel);
                
                const doorClip = gltf.animations.find(clip => clip.name.toLowerCase().includes('door')) || gltf.animations[0];
                
                if (doorClip) {
                    doorAction = mixer.clipAction(doorClip);
                    doorAction.setLoop(THREE.LoopOnce);
                    doorAction.clampWhenFinished = true;
                }
            }
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });

        // ฟังก์ชันสั่งสลับเปิด/ปิดประตู
        function toggleDoor() {
            if (!doorAction) return;

            doorAction.paused = false;
            if (!isDoorOpen) {
                doorAction.timeScale = 1;
                doorAction.play();
                isDoorOpen = true;
            } else {
                doorAction.timeScale = -1;
                doorAction.play();
                isDoorOpen = false;
            }
        }

        function moveCamera(targetCamPos, targetLookAt) {
            gsap.to(camera.position, {
                x: targetCamPos.x,
                y: targetCamPos.y,
                z: targetCamPos.z,
                duration: 1.8,
                ease: "power2.inOut"
            });

            gsap.to(controls.target, {
                x: targetLookAt.x,
                y: targetLookAt.y,
                z: targetLookAt.z,
                duration: 1.8,
                ease: "power2.inOut",
                onUpdate: () => controls.update()
            });
        }

        function focusCV() {
            moveCamera(
                { x: 0.0, y: 4.5, z: 8.0 }, 
                { x: 0.0, y: 0.5, z: 1.5 }
            );
        }

        function focusPhoto() {
            moveCamera(
                { x: -1.0, y: 3.5, z: 7.0 }, 
                { x: -1.0, y: 2.0, z: 0.0 }
            );
        }

        // คลิกตรวจจับชิ้นส่วนประตู/รูปภาพ/CV
        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            if (cafeModel) {
                const intersects = raycaster.intersectObjects(cafeModel.children, true);
                if (intersects.length > 0) {
                    const clickedObj = intersects[0].object;
                    const name = clickedObj.name.toLowerCase();

                    if (name.includes('door') || name.includes('gate')) {
                        toggleDoor();
                    } else if (name.includes('frame') || name.includes('photo') || name.includes('selfie')) {
                        focusPhoto();
                    } else if (name.includes('cv') || name.includes('text')) {
                        focusCV();
                    }
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
