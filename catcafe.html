<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Cat Cafe Portfolio</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f4ece1; font-family: sans-serif; }
        canvas { display: block; }
        
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .ui-btn {
            background-color: #7c523f;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
        }

        .ui-btn:hover {
            background-color: #a06e56;
            transform: translateY(-2px);
        }

        .hint-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #5a3d31;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="hint-text">💡 คลิกที่ประตูเพื่อเปิด/ปิดร้าน หรือกดปุ่มด้านล่างเพื่อสลับมุมมอง</div>

    <div class="ui-container">
        <button class="ui-btn" onclick="focusMainView()">🏠 มุมมองหลัก</button>
        <button class="ui-btn" onclick="toggleDoor()">🚪 เปิด/ปิดประตู</button>
        <button class="ui-btn" onclick="focusPhoto()">🖼️ ซูมรูปโปรไฟล์</button>
        <button class="ui-btn" onclick="focusCV()">📜 ซูมดูประวัติ (CV)</button>
    </div>

    <!-- Vertex & Fragment Shader สีชมพูพาสเทลสดใส -->
    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        varying vec3 vNormal;
        void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform float time;
        varying vec2 vUv;
        varying vec3 vNormal;

        void main() {
            float pulse = 0.85 + 0.15 * sin(time * 3.0 + vUv.x * 4.0);
            float rim = pow(1.0 - max(0.0, dot(vNormal, vec3(0.0, 0.0, 1.0))), 1.5);
            
            vec3 basePink = vec3(1.0, 0.35, 0.65) * pulse;
            vec3 glowRim = vec3(1.0, 0.6, 0.85) * rim * 1.3;
            
            gl_FragColor = vec4(basePink + glowRim, 1.0);
        }
    </script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4ece1);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const defaultCamPos = { x: 0, y: 7.0, z: 18.0 };
        const defaultTarget = { x: 0, y: 2.0, z: 0 };
        camera.position.set(defaultCamPos.x, defaultCamPos.y, defaultCamPos.z);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(defaultTarget.x, defaultTarget.y, defaultTarget.z);

        const pinkShaderMaterial = new THREE.ShaderMaterial({
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            uniforms: { time: { value: 0.0 } }
        });

        let cafeModel = null;
        let doorOpenModel = null;
        let doorClosedModel = null;
        let isDoorOpen = false;

        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const loader = new THREE.GLTFLoader();

        // 1. โหลดฉากหลัก
        loader.load('catcafe.glb', (gltf) => {
            cafeModel = gltf.scene;
            scene.add(cafeModel);

            // ใส่ Shader ที่ Awning
            cafeModel.traverse((child) => {
                if (child.isMesh && child.name === 'Awning') {
                    child.material = pinkShaderMaterial;
                }
                // ซ่อนชิ้นส่วนประตูเดิมถ้ามีซ้ำ
                if (child.name.toLowerCase().includes('cube')) {
                    child.visible = false;
                }
            });
        });

        // 2. โหลดไฟล์ประตูตอนปิด (DoorClosing.glb)
        loader.load('DoorClosing.glb', (gltf) => {
            doorClosedModel = gltf.scene;
            doorClosedModel.visible = true; // เริ่มต้นให้แสดงประตูแบบปิด
            scene.add(doorClosedModel);
        });

        // 3. โหลดไฟล์ประตูตอนเปิด (DoorOpen.glb)
        loader.load('DoorOpen.glb', (gltf) => {
            doorOpenModel = gltf.scene;
            doorOpenModel.visible = false; // เริ่มต้นซ่อนไว้ก่อน
            scene.add(doorOpenModel);
        });

        // ฟังก์ชันสั่งสลับเปิด/ปิดประตู แบบสลับโมเดล ชัวร์ 100%
        function toggleDoor() {
            isDoorOpen = !isDoorOpen;

            if (doorClosedModel && doorOpenModel) {
                doorClosedModel.visible = !isDoorOpen;
                doorOpenModel.visible = isDoorOpen;
            }
        }

        function moveCamera(targetCamPos, targetLookAt) {
            gsap.to(camera.position, {
                x: targetCamPos.x,
                y: targetCamPos.y,
                z: targetCamPos.z,
                duration: 1.8,
                ease: "power2.inOut"
            });

            gsap.to(controls.target, {
                x: targetLookAt.x,
                y: targetLookAt.y,
                z: targetLookAt.z,
                duration: 1.8,
                ease: "power2.inOut",
                onUpdate: () => controls.update()
            });
        }

        function focusMainView() {
            moveCamera(defaultCamPos, defaultTarget);
        }

        function focusCV() {
            moveCamera({ x: 0.0, y: 4.5, z: 8.0 }, { x: 0.0, y: 0.5, z: 1.5 });
        }

        function focusPhoto() {
            moveCamera({ x: -1.0, y: 3.5, z: 7.0 }, { x: -1.0, y: 2.0, z: 0.0 });
        }

        // ระบบคลิกตรวจจับประตู
        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            const interactiveObjects = scene.children;
            const intersects = raycaster.intersectObjects(interactiveObjects, true);

            if (intersects.length > 0) {
                const clickedObj = intersects[0].object;
                const name = clickedObj.name.toLowerCase();

                // ถ้าคลิกโดนชิ้นส่วนประตูใดๆ
                if (name.includes('door') || name.includes('gate') || name.includes('cube') || intersects[0].object.parent === doorClosedModel || intersects[0].object.parent === doorOpenModel) {
                    toggleDoor();
                } else if (name.includes('frame') || name.includes('photo') || name.includes('selfie')) {
                    focusPhoto();
                } else if (name.includes('cv') || name.includes('text')) {
                    focusCV();
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            
            pinkShaderMaterial.uniforms.time.value = clock.getElapsedTime();

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
