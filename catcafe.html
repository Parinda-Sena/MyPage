<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Cat Cafe Portfolio</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f4ece1; font-family: 'sans-serif'; }
        canvas { display: block; }
        
        /* เมนูปุ่มควบคุมมุมกล้อง */
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .ui-btn {
            background-color: #7c523f;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
        }

        .ui-btn:hover {
            background-color: #a06e56;
            transform: translateY(-2px);
        }

        .hint-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #5a3d31;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
    <!-- Library Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- GSAP library สำหรับสร้าง Motion การซูมกล้องให้นุ่มนวล -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="hint-text">💡 คลิกที่ปุ่มด้านล่าง หรือคลิกที่กรอบรูป/ข้อความบนฐานเพื่อซูมดูรายละเอียด</div>

    <div class="ui-container">
        <button class="ui-btn" onclick="focusMainView()">🏠 มุมมองหลัก</button>
        <button class="ui-btn" onclick="focusPhoto()">🖼️ ซูมรูปโปรไฟล์</button>
        <button class="ui-btn" onclick="focusCV()">📜 ซูมดูประวัติ (CV)</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4ece1);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // ตำแหน่งกล้องเริ่มต้น (มุมมองหลัก)
        const defaultCamPos = { x: 0, y: 3.5, z: 9 };
        const defaultTarget = { x: 0, y: 1.2, z: 0 };
        
        camera.position.set(defaultCamPos.x, defaultCamPos.y, defaultCamPos.z);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(defaultTarget.x, defaultTarget.y, defaultTarget.z);

        let cafeModel = null;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const loader = new THREE.GLTFLoader();
        loader.load('catcafe.glb', (gltf) => {
            cafeModel = gltf.scene;
            scene.add(cafeModel);
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });

        // ฟังก์ชันย้ายกล้องไปตามตำแหน่งเป้าหมายด้วย GSAP
        function moveCamera(targetCamPos, targetLookAt) {
            gsap.to(camera.position, {
                x: targetCamPos.x,
                y: targetCamPos.y,
                z: targetCamPos.z,
                duration: 1.8,
                ease: "power2.inOut"
            });

            gsap.to(controls.target, {
                x: targetLookAt.x,
                y: targetLookAt.y,
                z: targetLookAt.z,
                duration: 1.8,
                ease: "power2.inOut",
                onUpdate: () => controls.update()
            });
        }

        // ตำแหน่งมุมมองโฟกัสแต่ละส่วน
        function focusMainView() {
            moveCamera(defaultCamPos, defaultTarget);
        }

        function focusPhoto() {
            // โฟกัสไปที่กรอบรูปบนผนัง/ป้าย
            moveCamera({ x: -1.2, y: 2.2, z: 3.5 }, { x: -1.2, y: 2.0, z: 0 });
        }

        function focusCV() {
    moveCamera(
        { x: -0.2, y: 3.5, z: 4.5 },
        { x: -0.2, y: 0.2, z: 1.0 }  
    );
}

        // ระบบตรวจจับการคลิกบนชิ้นส่วน 3D (Raycaster)
        window.addEventListener('click', (event) => {
            // คำนวณตำแหน่งเมาส์ในระบบพิกัด Screen to World (-1 ถึง +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            if (cafeModel) {
                const intersects = raycaster.intersectObjects(cafeModel.children, true);
                if (intersects.length > 0) {
                    const clickedObj = intersects[0].object;
                    const name = clickedObj.name.toLowerCase();

                    
                    if (name.includes('frame') || name.includes('photo') || name.includes('selfie')) {
                        focusPhoto();
                    } else if (name.includes('cv') || name.includes('text') || name.includes('text_cv')) {
                        focusCV();
                    }
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
