<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Cat Cafe Portfolio</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f4ece1; font-family: sans-serif; }
        canvas { display: block; }
        
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .ui-btn {
            background-color: #7c523f;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s;
        }

        .ui-btn:hover {
            background-color: #a06e56;
            transform: translateY(-2px);
        }

        .hint-text {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #5a3d31;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="hint-text">💡 คลิกที่ประตูเพื่อเปิด/ปิดร้าน หรือกดปุ่มด้านล่างเพื่อสลับมุมมอง</div>

    <div class="ui-container">
        <button class="ui-btn" onclick="focusMainView()">🏠 มุมมองหลัก</button>
        <button class="ui-btn" onclick="toggleDoor()">🚪 เปิด/ปิดประตู</button>
        <button class="ui-btn" onclick="focusPhoto()">🖼️ ซูมรูปโปรไฟล์</button>
        <button class="ui-btn" onclick="focusCV()">📜 ซูมดูประวัติ (CV)</button>
    </div>

    <!-- ==================== CUSTOM SHADERS (WHITE GLOW) ==================== -->
    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        varying vec3 vNormal;
        
        void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform float time;
        uniform vec3 glowColor;
        varying vec2 vUv;
        varying vec3 vNormal;

        void main() {
            // จังหวะเรืองแสงนุ่มนวลตามเวลา
            float pulse = 0.85 + 0.15 * sin(time * 2.5 + vUv.y * 5.0);
            
            // เอฟเฟกต์แสงสะท้อนขอบ
            float rim = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
            
            vec3 finalColor = glowColor * pulse + vec3(rim * 0.3);
            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>
    <!-- ==================================================================== -->

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4ece1);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const defaultCamPos = { x: 0, y: 7, z: 20 };
        const defaultTarget = { x: 0, y: 2, z: 0 };
        camera.position.set(defaultCamPos.x, defaultCamPos.y, defaultCamPos.z);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(defaultTarget.x, defaultTarget.y, defaultTarget.z);

        // --- Custom Shader Material โทนสีขาวนวล (White Glow) ---
        const whiteGlowShaderMaterial = new THREE.ShaderMaterial({
            vertexShader: document.getElementById('vertexShader').textContent,
            fragmentShader: document.getElementById('fragmentShader').textContent,
            uniforms: {
                time: { value: 0.0 },
                glowColor: { value: new THREE.Color(0xffffff) } // กำหนดให้เป็นสีขาว
            }
        });

        let cafeModel = null;
        let mixer = null;
        let doorAction = null;
        let isDoorOpen = false;

        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const loader = new THREE.GLTFLoader();
        loader.load('catcafe.glb', (gltf) => {
            cafeModel = gltf.scene;
            scene.add(cafeModel);

            // ใส่ Shader ให้เฉพาะป้าย CAT CAFE และ เมนูตัวอักษร
            cafeModel.traverse((child) => {
                if (child.isMesh) {
                    const name = child.name.toLowerCase();

                    // เลือกเฉพาะป้าย CAT CAFE หรือ ตัวหนังสือเมนู
                    if (name.includes('cafe') || name.includes('menu') || name.includes('latte') || name.includes('text_menu') || name.includes('sign')) {
                        child.material = whiteGlowShaderMaterial;
                    }
                }
            });

            // ระบบอนิเมชันเปิด/ปิดประตู
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(cafeModel);
                const doorClip = gltf.animations.find(clip => clip.name.toLowerCase().includes('door') || clip.name.toLowerCase().includes('gate')) || gltf.animations[0];

                if (doorClip) {
                    doorAction = mixer.clipAction(doorClip);
                    doorAction.setLoop(THREE.LoopOnce);
                    doorAction.clampWhenFinished = true;
                }
            }
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });

        function toggleDoor() {
            if (!doorAction) return;

            doorAction.paused = false;
            if (!isDoorOpen) {
                doorAction.timeScale = 1;
                doorAction.play();
                isDoorOpen = true;
            } else {
                doorAction.timeScale = -1;
                doorAction.play();
                isDoorOpen = false;
            }
        }

        function moveCamera(targetCamPos, targetLookAt) {
            gsap.to(camera.position, {
                x: targetCamPos.x,
                y: targetCamPos.y,
                z: targetCamPos.z,
                duration: 1.8,
                ease: "power2.inOut"
            });

            gsap.to(controls.target, {
                x: targetLookAt.x,
                y: targetLookAt.y,
                z: targetLookAt.z,
                duration: 1.8,
                ease: "power2.inOut",
                onUpdate: () => controls.update()
            });
        }

        function focusMainView() {
            moveCamera(defaultCamPos, defaultTarget);
        }

        function focusCV() {
            moveCamera(
                { x: 0.0, y: 7.0, z: 12.0 }, 
                { x: 0.0, y: 0.5, z: 2.5 }
            );
        }

        function focusPhoto() {
            moveCamera(
                { x: -1.2, y: 2.5, z: 9.0 }, 
                { x: -1.2, y: 2.2, z: 0.0 }
            );
        }

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            if (cafeModel) {
                const intersects = raycaster.intersectObjects(cafeModel.children, true);
                if (intersects.length > 0) {
                    const clickedObj = intersects[0].object;
                    const name = clickedObj.name.toLowerCase();

                    if (name.includes('door') || name.includes('gate')) {
                        toggleDoor();
                    } else if (name.includes('frame') || name.includes('photo') || name.includes('selfie')) {
                        focusPhoto();
                    } else if (name.includes('cv') || name.includes('text')) {
                        focusCV();
                    }
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();

            // อัปเดตเวลาให้ Shader เรืองแสงสีขาวทำงานแบบ Dynamic
            whiteGlowShaderMaterial.uniforms.time.value = elapsedTime;

            if (mixer) mixer.update(clock.getDelta());

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
