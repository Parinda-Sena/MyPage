<!DOCTYPE html>
<html>
<head>
    <title>Paint Program</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #202020; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .top-toolbar { background: #2b2b2b; border-bottom: 1px solid #3a3a3a; padding: 10px 20px; display: flex; align-items: center; gap: 20px; color: #fff; position: relative; z-index: 10; }
        .tool-group { display: flex; align-items: center; gap: 8px; border-right: 1px solid #444; padding-right: 15px; }
        .tool-group:last-child { border-right: none; }
        .group-label { font-size: 11px; color: #888; margin-right: 5px; }
        .tool-btn { width: 38px; height: 38px; font-size: 18px; border: 1px solid #444; border-radius: 6px; background: #333; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .tool-btn.active { background: #0078d4; border-color: #005a9e; }
        .btn-back-main { width: 38px; height: 38px; font-size: 14px; border: 1px solid #444; border-radius: 6px; background: #444; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .color-palette { display: flex; gap: 6px; align-items: center; }
        .color-dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: 0 0 2px rgba(0,0,0,0.5); }
        .color-dot.active { border-color: #fff; box-shadow: 0 0 4px #0078d4; }
        .stroke-control { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .stroke-input { width: 60px; padding: 4px; border: 1px solid #444; border-radius: 4px; background: #333; color: #fff; text-align: center; }
        .canvas-workspace { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px; position: relative; }
        #paint-canvas { background: #ffffff; box-shadow: 0 8px 24px rgba(0,0,0,0.4); image-rendering: pixelated; cursor: crosshair; }
        #paint-cursor { position: absolute; pointer-events: none; font-size: 20px; transform: translate(2px, -22px); display: none; z-index: 999; }
    </style>
</head>
<body>

    <div class="top-toolbar">
        <a href="menu.html" class="btn-back-main" title="กลับหน้าเมนูหลัก">🏠</a>

        <div class="tool-group">
            <span class="group-label">Tools:</span>
            <button id="btn-pencil" class="tool-btn active" onclick="changeTool('pencil')">✏️</button>
            <button id="btn-line" class="tool-btn" onclick="changeTool('line')">│</button>
            <button id="btn-rect" class="tool-btn" onclick="changeTool('rect')">□</button>
            <button id="btn-circle" class="tool-btn" onclick="changeTool('circle')">◯</button>
            <button id="btn-eraser" class="tool-btn" onclick="changeTool('eraser')">🧽</button>
        </div>

        <div class="tool-group">
            <div class="stroke-control">
                <span class="group-label">Size:</span>
                <input type="number" id="strokeSize" class="stroke-input" value="1" min="1" onchange="thickness = parseInt(this.value) || 1">
            </div>
        </div>

        <div class="tool-group">
            <span class="group-label">Colors:</span>
            <div class="color-palette">
                <div class="color-dot active" style="background: #ff0000;" onclick="selectPresetColor('#ff0000', this)"></div>
                <div class="color-dot" style="background: #00ff00;" onclick="selectPresetColor('#00ff00', this)"></div>
                <div class="color-dot" style="background: #0000ff;" onclick="selectPresetColor('#0000ff', this)"></div>
                <div class="color-dot" style="background: #ffff00;" onclick="selectPresetColor('#ffff00', this)"></div>
                <div class="color-dot" style="background: #ff00ff;" onclick="selectPresetColor('#ff00ff', this)"></div>
                <div class="color-dot" style="background: #00ffff;" onclick="selectPresetColor('#00ffff', this)"></div>
                <div class="color-dot" style="background: #000000;" onclick="selectPresetColor('#000000', this)"></div>
                <div class="color-dot" style="background: #8b4513;" onclick="selectPresetColor('#8b4513', this)"></div>
                <input type="color" id="colorPicker" value="#ff0000" style="width:30px; height:26px; border:1px solid #444; cursor:pointer;" oninput="updateColor(this.value); clearColorDotActive();">
            </div>
        </div>
    </div>

    <div class="canvas-workspace" id="paint-workspace">
        <canvas id="paint-canvas" width="800" height="500"></canvas>
        <div id="paint-cursor">✏️</div>
    </div>

    <script>
        const paintCanvas = document.getElementById('paint-canvas');
        const paintCtx = paintCanvas.getContext('2d');
        const paintWorkspace = document.getElementById('paint-workspace');
        const paintCursor = document.getElementById('paint-cursor');
        const strokeInput = document.getElementById('strokeSize');
       
        const mainImageData = paintCtx.createImageData(paintCanvas.width, paintCanvas.height);
        const mainPixels = mainImageData.data; 
        
        const tempImageData = paintCtx.createImageData(paintCanvas.width, paintCanvas.height);
        const tempPixels = tempImageData.data;

        let isDragging = false; 
        let previousX = 0; 
        let previousY = 0;
        let startX = 0;
        let startY = 0; 
        let currentX = 0;
        let currentY = 0;
        
        let pR = 255, pG = 0, pB = 0; 
        let currentTool = 'pencil'; 
        let thickness = 1; 

        function putPixel(targetPixels, x, y, r, g, b, a = 255) {
          if (x < 0 || x >= paintCanvas.width || y < 0 || y >= paintCanvas.height) return;
          const idx = (y * paintCanvas.width + x) * 4; 
          targetPixels[idx] = r; 
          targetPixels[idx + 1] = g; 
          targetPixels[idx + 2] = b; 
          targetPixels[idx + 3] = a;
        }

        function putPixelWithThickness(targetPixels, x, y, r, g, b, a = 255) {
          if (thickness === 1) { 
            putPixel(targetPixels, x, y, r, g, b, a); 
          } else {
            const offset = Math.floor(thickness / 2);
            for (let dy = -offset; dy <= offset; dy++) {
              for (let dx = -offset; dx <= offset; dx++) { 
                putPixel(targetPixels, x + dx, y + dy, r, g, b, a); 
              }
            }
          }
        }

        function drawLine(targetPixels, x1, y1, x2, y2, r, g, b, a = 255) {
          const dx = Math.abs(x2 - x1); 
          const dy = Math.abs(y2 - y1);
          if(dx > dy) {
            const m = (y2 - y1) / (x2 - x1); 
            const c = y1 - m * x1;
            for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) { 
                putPixelWithThickness(targetPixels, x, Math.round(m * x + c), r, g, b, a); 
            }
          } else {
            const m = (x2 - x1) / (y2 - y1); 
            const c = x1 - m * y1;
            for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) { 
                putPixelWithThickness(targetPixels, Math.round(m * y + c), y, r, g, b, a); 
            }
          }
        }

        function drawRect(targetPixels, x1, y1, x2, y2, r, g, b, a = 255) {
          drawLine(targetPixels, x1, y1, x2, y1, r, g, b, a); 
          drawLine(targetPixels, x2, y1, x2, y2, r, g, b, a); 
          drawLine(targetPixels, x2, y2, x1, y2, r, g, b, a); 
          drawLine(targetPixels, x1, y2, x1, y1, r, g, b, a); 
        }

        function drawRectFilled(targetPixels, x1, y1, x2, y2, r, g, b, a = 255) {
          const startX = Math.min(x1, x2);
          const endX = Math.max(x1, x2);
          const startY = Math.min(y1, y2);
          const endY = Math.max(y1, y2);
          for (let y = startY; y <= endY; y++) { 
            for (let x = startX; x <= endX; x++) { 
                putPixel(targetPixels, x, y, r, g, b, a); 
            } 
          }
        }

        function drawCircleOutline(targetPixels, cx, cy, radius, r, g, b, a = 255) {
          let x = radius; 
          let y = 0; 
          let err = 1 - x;
          while (x >= y) {
            putPixelWithThickness(targetPixels, cx + x, cy + y, r, g, b, a); 
            putPixelWithThickness(targetPixels, cx + y, cy + x, r, g, b, a);
            putPixelWithThickness(targetPixels, cx - y, cy + x, r, g, b, a); 
            putPixelWithThickness(targetPixels, cx - x, cy + y, r, g, b, a);
            putPixelWithThickness(targetPixels, cx - x, cy - y, r, g, b, a); 
            putPixelWithThickness(targetPixels, cx - y, cy - x, r, g, b, a);
            putPixelWithThickness(targetPixels, cx + y, cy - x, r, g, b, a); 
            putPixelWithThickness(targetPixels, cx + x, cy - y, r, g, b, a); 
            y++;
            if (err < 0) { err += 2 * y + 1; } else { x--; err += 2 * (y - x) + 1; }
          }
        }

        function toScaledMousePos(posX, posY) {
          const rect = paintCanvas.getBoundingClientRect();
          return { 
            x: Math.floor((posX - rect.left) * (paintCanvas.width / rect.width)), 
            y: Math.floor((posY - rect.top) * (paintCanvas.height / rect.height)) 
          };
        }


        paintWorkspace.addEventListener('mousemove', (event) => {
          if (currentTool === 'pencil' || currentTool === 'eraser') {
            const rect = paintWorkspace.getBoundingClientRect();
            paintCursor.style.left = (event.clientX - rect.left) + 'px'; 
            paintCursor.style.top = (event.clientY - rect.top) + 'px';
          }
        });

        paintCanvas.addEventListener('mouseenter', updateCursorIcon);
        paintCanvas.addEventListener('mouseleave', () => paintCursor.style.display = 'none');
        
        // Mousedown Event
        paintCanvas.addEventListener('mousedown', (event) => {
          isDragging = true; 
          const { x, y } = toScaledMousePos(event.clientX, event.clientY);
          startX = x; startY = y; 
          previousX = x; previousY = y;
          currentX = x; currentY = y;

          if (currentTool === 'pencil') {
            putPixelWithThickness(mainPixels, x, y, pR, pG, pB);
          } else if (currentTool === 'eraser') {
            putPixelWithThickness(mainPixels, x, y, 255, 255, 255); 
          }
        });

        paintCanvas.addEventListener('mousemove', (event) => {
          const { x, y } = toScaledMousePos(event.clientX, event.clientY);
          currentX = x;
          currentY = y;

          if(!isDragging) return; 


          if (currentTool === 'pencil') {
            drawLine(mainPixels, previousX, previousY, x, y, pR, pG, pB);
          } else if (currentTool === 'eraser') {
            drawLine(mainPixels, previousX, previousY, x, y, 255, 255, 255); 
          }
          
          previousX = x; 
          previousY = y;
        });


        paintCanvas.addEventListener('mouseup', () => {
          if (!isDragging) return; 
          isDragging = false;
          
          if (currentTool === 'line') {
            drawLine(mainPixels, startX, startY, currentX, currentY, pR, pG, pB);
          } else if (currentTool === 'rect') {
            drawRect(mainPixels, startX, startY, currentX, currentY, pR, pG, pB);
          } else if (currentTool === 'circle') {
            const radius = Math.round(Math.sqrt(Math.pow(currentX - startX, 2) + Math.pow(currentY - startY, 2)));
            if (radius > 0) drawCircleOutline(mainPixels, startX, startY, radius, pR, pG, pB);
          }
        });

        window.addEventListener('keydown', (event) => {
            const dots = document.querySelectorAll('.color-dot');
            if(event.key === '1') selectPresetColor('#ff0000', dots[0]);
            if(event.key === '2') selectPresetColor('#00ff00', dots[1]);
            if(event.key === '3') selectPresetColor('#0000ff', dots[2]);
            
            if (event.key === 'ArrowUp' || event.key === '+' || event.key === 'Add') { 
                thickness += 1; 
                strokeInput.value = thickness; 
            }
            if (event.key === 'ArrowDown' || event.key === '-' || event.key === 'Subtract') { 
                if (thickness > 1) { 
                    thickness -= 1; 
                    strokeInput.value = thickness; 
                } 
            }
        });

        function changeTool(toolName) {
          currentTool = toolName;
          document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
          document.getElementById(`btn-${toolName}`).classList.add('active');
          updateCursorIcon();
        }
        
        function updateColor(hexValues) {
          pR = parseInt(hexValues.substr(1, 2), 16); 
          pG = parseInt(hexValues.substr(3, 2), 16); 
          pB = parseInt(hexValues.substr(5, 2), 16);
        }
        
        function selectPresetColor(hexValue, element) {
          updateColor(hexValue); 
          document.getElementById('colorPicker').value = hexValue;
          clearColorDotActive(); 
          element.classList.add('active');
        }
        
        function clearColorDotActive() { 
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active')); 
        }

        function updateCursorIcon() {
          if (currentTool === 'pencil') { paintCursor.innerText = '✏️'; paintCursor.style.display = 'block'; paintCanvas.style.cursor = 'none'; }
          else if (currentTool === 'eraser') { paintCursor.innerText = '🧽'; paintCursor.style.display = 'block'; paintCanvas.style.cursor = 'none'; }
          else { paintCursor.style.display = 'none'; paintCanvas.style.cursor = 'crosshair'; }
        }
        

        drawRectFilled(mainPixels, 0, 0, paintCanvas.width - 1, paintCanvas.height - 1, 255, 255, 255); 

        function animate() {
          tempPixels.set(mainPixels);

          if (isDragging) {
            if (currentTool === 'line') {
              drawLine(tempPixels, startX, startY, currentX, currentY, pR, pG, pB);
            } else if (currentTool === 'rect') {
              drawRect(tempPixels, startX, startY, currentX, currentY, pR, pG, pB);
            } else if (currentTool === 'circle') {
              const radius = Math.round(Math.sqrt(Math.pow(currentX - startX, 2) + Math.pow(currentY - startY, 2)));
              if (radius > 0) drawCircleOutline(tempPixels, startX, startY, radius, pR, pG, pB);
            }
          }

    
          paintCtx.putImageData(tempImageData, 0, 0);
          requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
