<!DOCTYPE html>
<html>

<head>
    <title>3D Scene with GLTF Model</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- Three.js Core & Loaders -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- dat.GUI Library สำหรับสร้างกล่องปรับแสงด้วยเมาส์ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>

    <script>
        // 1. Setup Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        // 2. Setup Scene & Camera
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 3. Setup Lights
        const ambientLight = new THREE.AmbientLight(0xffe6f2, 0.9);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffd19e, 1.6);
        directionalLight.position.set(5, 12, 7);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        scene.add(directionalLight);

        // ==========================================
        // 🛠️ GUI Controls ปรับแสงด้วยเมาส์ (มุมขวาบน)
        // ==========================================
        const gui = new dat.GUI();

        // เมนูควบคุม Directional Light (แสงหลัก + เงา)
        const lightFolder = gui.addFolder('Directional Light');
        lightFolder.add(directionalLight.position, 'x', -20, 20, 0.1).name('Pos X');
        lightFolder.add(directionalLight.position, 'y', 0, 30, 0.1).name('Pos Y');
        lightFolder.add(directionalLight.position, 'z', -20, 20, 0.1).name('Pos Z');
        lightFolder.add(directionalLight, 'intensity', 0, 5, 0.1).name('Intensity');

        const lightColor = { color: '#ffd19e' };
        lightFolder.addColor(lightColor, 'color').name('Color').onChange((value) => {
            directionalLight.color.set(value);
        });
        lightFolder.open();

        // เมนูควบคุม Ambient Light (แสงโดยรอบ)
        const ambientFolder = gui.addFolder('Ambient Light');
        ambientFolder.add(ambientLight, 'intensity', 0, 2, 0.1).name('Intensity');

        // 4. Load EXR Skybox
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/kloppenheim_02_1k.exr'; 
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });

        // Ground Plane แบบโปร่งแสง (รับเฉพาะเงาตกกระทบ)
        const planeGeometry = new THREE.PlaneGeometry(10, 10);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.4 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = 0;
        plane.receiveShadow = true;
        scene.add(plane);

        // ==========================================
        // 5. ดึงไฟล์โมเดล Fox.glb
        // ==========================================
        const gltfLoader = new THREE.GLTFLoader();
        
        // แนะนำใช้ Relative Path หากไฟล์ Fox.glb อยู่โฟลเดอร์เดียวกับ HTML
        const modelUrl = './Fox.glb'; 

        gltfLoader.load(
            modelUrl,
            (gltf) => {
                const model = gltf.scene;

                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // จัดตำแหน่งและสเกลโมเดลให้อยู่ตรงกลางและพอดีฉากอัตโนมัติ
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                model.position.x += (model.position.x - center.x);
                model.position.y += (model.position.y - box.min.y);
                model.position.z += (model.position.z - center.z);

                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scale = 2 / maxDim;
                    model.scale.set(scale, scale, scale);
                }

                scene.add(model);
                console.log('โหลดโมเดลสำเร็จแล้ว!');
            },
            (xhr) => {
                if (xhr.total > 0) {
                    console.log((xhr.loaded / xhr.total * 100).toFixed(2) + '% loaded');
                }
            },
            (error) => {
                console.error('เกิดข้อผิดพลาดในการโหลดโมเดล:', error);
            }
        );

        // 6. Animation Loop & Window Resize Handling
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
