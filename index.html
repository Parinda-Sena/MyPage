<!DOCTYPE html>
<html>
<head>
    <title>CV - Profile</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #ff7cde; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .cv-page-full { width: 100%; max-width: 650px; background-color: #ffffff; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-radius: 12px; display: flex; flex-direction: column; }
        .cv-header { text-align: center; margin-bottom: 25px; }
        .cv-header h1 { margin: 0 0 5px 0; color: #1a1a1a; font-size: 32px; }
        .cv-header h2 { margin: 0; color: #f200ff; font-size: 22px; font-weight: 500; }
        .cv-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; background-color: #f8f9fa; padding: 20px; border-radius: 8px; }
        .cv-details p { margin: 0; font-size: 15px; color: #444; line-height: 1.6; }
        .btn-primary-action { display: block; width: 100%; padding: 14px; background-color: #ff55e0; color: white; text-align: center; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; transition: background-color 0.2s; }
        .btn-primary-action:hover { background-color: #d63bb8; }
    </style>
</head>
<body>

    <div class="cv-page-full">
        <div class="cv-header">
            <h1>CV</h1>
            <h2>นางสาวปริณดา เสนา (ปาย)</h2>
        </div>
        
        <div class="cv-details">
            <p><strong>อายุ:</strong> 20 ปี</p>
            <p><strong>อีเมล:</strong> parinda.se@ku.th</p>
            <p><strong>เบอร์โทร:</strong> 0925972953</p>
            <p><strong>มหาวิทยาลัย:</strong> เกษตรศาสตร์</p>
            <p><strong>วิทยาเขต:</strong> กำแพงแสน</p>
            <p><strong>คณะ:</strong> ศิลปศาสตร์และวิทยาศาสตร์</p>
            <p><strong>สาขา:</strong> วิทยาการคอมพิวเตอร์</p>
        </div>

        <!-- ลิงก์ข้ามไปไฟล์เมนู -->
        <a href="menu.html" class="btn-primary-action">ถัดไป ➔</a>
    </div>

</body>
</html>
